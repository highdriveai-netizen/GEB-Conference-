<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle grid and scientific lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="250" y1="0" x2="250" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="550" y1="0" x2="550" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="850" y1="0" x2="850" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="440" x2="1200" y2="440" />
  </g>

  <!-- Large Stylized DNA Helix on Right -->
  <g transform="translate(820, 80) scale(1.6)" opacity="0.35">
    <path d="M50 0 C 120 100, -20 200, 50 300" stroke="#6ee7b7" stroke-width="6" fill="none" />
    <path d="M50 0 C -20 100, 120 200, 50 300" stroke="#38bdf8" stroke-width="6" fill="none" />
    <line x1="10" y1="50" x2="90" y2="50" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 3" />
    <line x1="45" y1="100" x2="55" y2="100" stroke="#ffffff" stroke-width="4" />
    <line x1="10" y1="150" x2="90" y2="150" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 3" />
    <line x1="45" y1="200" x2="55" y2="200" stroke="#ffffff" stroke-width="4" />
    <line x1="10" y1="250" x2="90" y2="250" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 3" />
    <circle cx="50" cy="0" r="8" fill="#34d399" />
    <circle cx="90" cy="50" r="6" fill="#38bdf8" />
    <circle cx="10" cy="150" r="6" fill="#34d399" />
    <circle cx="50" cy="300" r="8" fill="#38bdf8" />
  </g>

  <!-- Content -->
  <g transform="translate(90, 100)">
    <text x="0" y="30" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#6ee7b7" letter-spacing="0.16em">DEPARTMENT OF GENETIC ENGINEERING &amp; BIOTECHNOLOGY · UNIVERSITY OF CHITTAGONG</text>
    
    <text x="0" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="-0.02em">2nd International</text>
    <text x="0" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="56" fill="#a7f3d0" letter-spacing="-0.02em">Biotechnology Conference</text>
    <text x="0" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="-0.02em">2026</text>

    <text x="0" y="315" font-family="Inter, sans-serif" font-weight="400" font-size="22" fill="#d1fae5" width="700">Next Generation Biotechnology: Exploring Emerging Frontiers &amp; Global Collaboration</text>
    
    <g transform="translate(0, 360)">
      <rect width="460" height="60" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#6ee7b7" stroke-width="1.2" />
      <text x="24" y="37" font-family="Inter, sans-serif" font-weight="600" font-size="17" fill="#ffffff">December 2026 [Date TBA] · Chittagong, Bangladesh</text>
    </g>
  </g>
</svg>
