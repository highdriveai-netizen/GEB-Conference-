    <path d="M20 50C20 38 44 26 44 14" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <path d="M44 50C44 38 20 26 20 14" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <!-- Rungs -->
    <line x1="23" y1="20" x2="41" y2="20" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3" />
    <line x1="27" y1="32" x2="37" y2="32" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" />
    <line x1="23" y1="44" x2="41" y2="44" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3" />
