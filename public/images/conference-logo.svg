  <text x="86" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#064e3b" letter-spacing="-0.02em">IBC 2026</text>
  <text x="86" y="47" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="11" fill="#047857" letter-spacing="0.06em">2ND INTERNATIONAL BIOTECHNOLOGY CONFERENCE</text>
  <text x="86" y="62" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="10" fill="#64748b" letter-spacing="0.02em">University of Chittagong · Bangladesh</text>
